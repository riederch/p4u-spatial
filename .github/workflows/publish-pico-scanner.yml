name: Publish PICO Scanner APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      version_name:
        description: Semantic application version, for example 0.1.1
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android versionCode
        required: true
        type: number
      mandatory:
        description: Mark update as mandatory
        required: true
        default: false
        type: boolean
      release_notes:
        description: Optional release notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pico-scanner-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_DIR: clients/pico-scanner
      APK_PATH: clients/pico-scanner/app/build/outputs/apk/release/app-release.apk
      RELEASE_ID: pico-scanner-${{ inputs.version_name }}-${{ inputs.channel }}
      TAG_NAME: pico-scanner-v${{ inputs.version_name }}-${{ inputs.channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version_name must be semantic-version-like"
            exit 1
          fi
          if [ "${{ inputs.version_code }}" -le 0 ]; then
            echo "version_code must be positive"
            exit 1
          fi

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.P4U_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/p4u-scanner.jks"
          chmod 600 "$RUNNER_TEMP/p4u-scanner.jks"

      - name: Build signed release APK
        working-directory: clients/pico-scanner
        env:
          P4U_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/p4u-scanner.jks
          P4U_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.P4U_ANDROID_KEYSTORE_PASSWORD }}
          P4U_ANDROID_KEY_ALIAS: ${{ secrets.P4U_ANDROID_KEY_ALIAS }}
          P4U_ANDROID_KEY_PASSWORD: ${{ secrets.P4U_ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease             -PP4U_VERSION_NAME="${{ inputs.version_name }}"             -PP4U_VERSION_CODE="${{ inputs.version_code }}"

      - name: Verify signed APK and collect metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK_PATH"

          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK_PATH")"
          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ': ' | tr 'A-F' 'a-f')"

          test "${#SHA256}" -eq 64
          test "${#CERT_SHA256}" -eq 64

          ASSET_NAME="p4u-spatial-scanner-${{ inputs.version_name }}-${{ inputs.channel }}.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$ASSET_NAME"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release descriptor
        shell: bash
        env:
          SHA256: ${{ steps.metadata.outputs.sha256 }}
          SIZE: ${{ steps.metadata.outputs.size }}
          CERT_SHA256: ${{ steps.metadata.outputs.cert_sha256 }}
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import json, os
          owner_repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG_NAME"]
          asset = os.environ["ASSET_NAME"]
          descriptor = {
              "releaseId": os.environ["RELEASE_ID"],
              "version": "${{ inputs.version_name }}",
              "versionCode": int("${{ inputs.version_code }}"),
              "channel": "${{ inputs.channel }}",
              "platform": "android-pico",
              "mandatory": "${{ inputs.mandatory }}".lower() == "true",
              "releaseNotes": os.environ.get("RELEASE_NOTES", ""),
              "compatibility": {
                  "core": "0.1",
                  "xr": "0.1",
                  "spatial": "0.1"
              },
              "package": {
                  "href": f"https://github.com/{owner_repo}/releases/download/{tag}/{asset}",
                  "size": int(os.environ["SIZE"]),
                  "sha256": os.environ["SHA256"],
                  "signingCertificateSha256": os.environ["CERT_SHA256"]
              }
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "release-descriptor.json"), "w", encoding="utf-8") as f:
              json.dump(descriptor, f, indent=2)
              f.write("\n")
          PY
          cat "$RUNNER_TEMP/release-descriptor.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME"             "$RUNNER_TEMP/${{ steps.metadata.outputs.asset_name }}"             "$RUNNER_TEMP/release-descriptor.json"             --title "P4U Spatial Scanner ${{ inputs.version_name }} (${{ inputs.channel }})"             --notes "${{ inputs.release_notes || format('P4U Spatial Scanner {0} ({1})', inputs.version_name, inputs.channel) }}"             ${{ inputs.channel == 'stable' && '--latest' || '--prerelease' }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-scanner-${{ inputs.version_name }}-${{ inputs.channel }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/${{ steps.metadata.outputs.asset_name }}
            ${{ runner.temp }}/release-descriptor.json
