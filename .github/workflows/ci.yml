name: CI

on:
  workflow_dispatch:
    inputs:
      bootstrap_lockfile:
        description: Generate and commit package-lock.json before running checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript, schemas and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: ${{ inputs.bootstrap_lockfile && 'write' || 'read' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Bootstrap lockfile
        if: inputs.bootstrap_lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        if: inputs.bootstrap_lockfile
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push
          fi

      - name: Require lockfile
        if: ${{ !inputs.bootstrap_lockfile }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing. Re-run this workflow with bootstrap_lockfile=true once."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run checks
        run: npm run check
